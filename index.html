<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Poem Genearotor</title>
    <link rel="stylesheet" href="src/style.css">
    <script src="https://cdn.jsdelivr.net/npm/typewriter-effect@3/dist/core.js"></script>
    <script src="https://unpkg.com/axios@1.20.0/dist/axios.min.js"></script>
</head>
<body>
  <div class="container">
    <header>
       <h1>
           AI Poem Genearotor
       </h1>
    </header>


    <main>
        <div class="form-wrap">
        <form id="poem-generator-form">
            <input
             type="text" 
             placeholder="Enter the topic of the poem you would to generate"
             autofocus
             required
             autocomplete="off"
             class="instruction"
             id="instruction-value"
             />
            <input type="submit" class="button"/>
        </form>
        <div class="idea">i.e Flower, Love, Mother</div>
        </div>
        <div class="poem" id="poem"></div>
    </main>

    <footer>
        This project was coded by 
        <a href="https://github.com/fagbenlefunmi-bit">Oluwafunmilayo</a> and is open-soourced on 
         <a href="https://github.com/fagbenlefunmi-bit/Poem-generator" target="_blank">Github</a>
         and is hosted on <a href="https://funmi-poem-generator.netlify.app">Netlify</a>
    </footer>
    </div>
    <script src="src/index.js"></script>

</body>
</html>
